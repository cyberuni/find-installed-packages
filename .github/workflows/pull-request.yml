name: pull-request
on:
  pull_request:
    types: [opened, synchronize]
  merge_group:

jobs:
  code:
    uses: cyberuni/.github/.github/workflows/bun-verify.yml@v2
    with:
      os: '["ubuntu-latest"]'
      skip-playwright: true

  # Bun's resolver serves `<pkg>/package.json` even when `exports` hides it, so `bun test`
  # never reaches the `require.resolve.paths()` fallback in `resolvePackageDir`. This runs
  # the Node spec against the build and uploads its coverage, mapped back to `src/`, under
  # the `node` flag. Codecov merges it with Bun's upload for the same commit.
  #
  # Not a required check: it exists for the upload. A failing Node spec still fails it.
  # Codecov runs without a token here, and a rejected upload still shows a green step, so
  # read the upload log rather than the step's status.
  node-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: bun install --frozen-lockfile
      - name: Build
        working-directory: packages/find-installed-packages
        run: bun run build
      - name: Node spec with coverage
        working-directory: packages/find-installed-packages
        run: bun run coverage:node
      - uses: codecov/codecov-action@v7
        with:
          files: packages/find-installed-packages/coverage/node/lcov.info
          disable_search: true
          flags: node

  changeset:
    runs-on: ubuntu-latest
    # `pull_request` only. On `merge_group` there is no `github.head_ref`, so the
    # changeset-release guard below silently stops matching and this job runs against the
    # queued "Version Packages" commit — where every changeset has just been consumed and
    # `changeset status` therefore exits 1. That made the merge-queue run for #287 red
    # even though the PR was correct; it merged only because `changeset` is not a required
    # status context. There is nothing to check in the queue anyway: the same commits were
    # already checked on the pull request.
    if: >-
      github.event_name == 'pull_request'
      && github.actor != 'renovate[bot]'
      && github.actor != 'dependabot[bot]'
      && !startsWith(github.head_ref, 'changeset-release/')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check for changeset
        run: bunx changeset status --since=origin/main
