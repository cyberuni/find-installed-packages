name: release
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  code:
    uses: unional/.github/.github/workflows/bun-verify.yml@main
    with:
      os: '["ubuntu-latest"]'

  release:
    uses: unional/.github/.github/workflows/bun-release-changeset.yml@main
    needs: code
    secrets: inherit
